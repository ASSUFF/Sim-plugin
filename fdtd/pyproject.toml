[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumerical-fdtd"
version = "0.1.0"
description = "MCP server that drives a local Ansys Lumerical FDTD install"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["fdtd", "lumerical", "mcp", "photonics"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "mcp>=1.2",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lumerical-fdtd = "lumerical_fdtd.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lumerical_fdtd = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
